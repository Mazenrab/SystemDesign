              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerformerResponse'
        '400':
          description:  Невалидные значения параметров .
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                BadRequest:
                  summary: "Ошибка при выполнении запроса."
