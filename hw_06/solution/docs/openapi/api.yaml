          description: Уникальный UUID события.
          schema:
            type: string
            format: uuid
          example: "d3b07384-d113-4c5e-a9b0-99f57b6495b6"
      responses:
        '200':
          description: Данные события успешно получены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '404':
          description: Событие не найдено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EventNotFound:
                  value:
                    error: "NOT_FOUND"
                    message: "Запрошенное мероприятие не найдено или перемещено в архив."
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/venues/{venueId}/zones/{venueZoneId}/seats/v{version}:
    get:
      summary: "Получение списка мест в зоне площадки"
      description: "Возвращает статический список физических мест внутри конкретного сектора. Для получения динамических статусов занятости мест конкретного мероприятия используйте Event API."
      tags:
        - All users
      parameters:
        - $ref: '#/components/parameters/CorrelationIdParam'        
        - name: venueId
          in: path
          required: true
          description: Уникальный UUID площадки.
          schema:
            type: string
            format: uuid
        - name: venueZoneId
          in: path
          required: true
          description: Уникальный UUID зоны.
          schema:
            type: string
            format: uuid
          example: "9e8d7c6b-5432-10fe-ba98-fedcba987654"
        - name: version
          in: path
          required: true
          description: Номер версии схемы.
          schema:
            type: integer
          example: 5
      responses:
        '200':
          description: Успешное получение списка мест в зоне.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VenueSeatResponse'
        '400':
          description:  Ошибка при выполнении запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                BadRequest:
                  summary: Ошибка при выполнении запроса
                  value:
                    error: "BAD_REQUEST"
                    message: "Ошибка при выполнении запроса."
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'


  /api/v1/events/{eventId}/zones/{venueZoneId}/seats/stream:
    get:
      summary: "Стрим динамических статусов мест (SSE)"
      description: |
        Открывает постоянное HTTP-соединение для отправки обновлений статусов мест в реальном времени.
        Клиент получает начальный снимок (snapshot) всех мест, а затем только дельты (изменения статусов).
        
        **Формат стрима (text/event-stream):**
        ```ev
        event: seat_update
        data: [{"map_element_id": "seat_row3_space14", "status": "reserved", "expires_at": "2026-10-13T23:25:00Z"}]
        ```
      tags:
        - All users
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdParam'        
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: venueZoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          description: Идентификатор последнего полученного события (используется для восстановления пропущенных данных при переподключении).
          schema:
            type: string
      responses:
        '200':
          description: Успешное установление SSE-соединения.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SeatStatusUpdateEvent'
        '400':
          description: Неверный UUID или параметры.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EventNotFound:
                  value:
                    error: "BAD_REQUEST"
                    message: "Неверный UUID или параметры."

        '404':
          description:  Мероприятие или зона не найдены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EventNotFound:
                  value:
                    error: "NOT_FOUND"
                    message: " Мероприятие или зона не найдены."
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/events/{eventId}/zones/{venueZoneId}/seats/status:
    get:
      summary: "Получение статусов мест методом Pooling (резерв)"
      description: |
        Используется в качестве graceful degradation, если SSE-соединение недоступно.
        Фронтенд должен опрашивать этот эндпоинт с интервалом в 5–30 секунд.
        Для оптимизации трафика рекомендуется передавать таймстемп `since`, чтобы сервер возвращал только изменения с момента последнего запроса.
      tags:
        - All users
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdParam'
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: venueZoneId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          required: false
          description: Таймстемп последнего успешного запроса (ISO 8601). Если передан, вернутся только изменения после этого времени.
          schema:
            type: string
            format: date-time
          example: "2026-10-13T23:15:00Z"
      responses:
        '200':
          description: Успешный возврат текущих статусов (или дельты изменений).
          headers:
            X-Server-Timestamp:
              description: Текущее время сервера. Фронтенд должен использовать его в следующем запросе в параметре `since`.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: object
                required: [last_timestamp, seats]
                properties:
                  last_timestamp:
                    type: string
                    format: date-time
                    example: "2026-10-13T23:15:05Z"
                  seats:
                    type: array
                    items:
                      $ref: '#/components/schemas/SeatStatusItem'
        '400':
          description:  Ошибка при выполнении запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                BadRequest:
                  summary: Ошибка при выполнении запроса
                  value:
                    error: "BAD_REQUEST"
                    message: "Ошибка при выполнении запроса."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/bookings/lock:
    post:
      summary: Резервирование мест на конкретное мероприятие
      tags:
      - All users
      parameters:
        - $ref: '#/components/parameters/CorrelationIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
               oneOf:
                - $ref: '#/components/schemas/CreateLockBySeatsRequest'
                - $ref: '#/components/schemas/CreateLockByZoneRequest'
      responses:
        '201':
          description: Места успешно зарезервированы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLockBySeatsResponse'
        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Места уже кем-то зарезервированны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidToken:
                  summary: Места уже зарезервированы
                  value:
                    error: "VALIDATION_FAILED"
                    message: "Все или часть мест уже были зарезервированны."
                    details:
                        seats:['seat_1', 'seat_2']
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/bookings/lock/{lockId}:
    delete:
      summary: Отмена резервирования мест
      tags:
        - All users
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
        - name: lockId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Резерв снят
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                      type: boolean
                      example: true        

        '401':
          description: Неверный логин или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Резервирование не найдено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EventNotFound:
                  value:
                    error: "NOT_FOUND"
                    message: "Запрошенный резерв не найден."
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/bookings:
    post:
      summary: Оформление нового заказа
      tags:
        - All users
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationIdParam'
        - $ref: '#/components/parameters/IdempotencyKeyParam'
      requestBody:
        required: true
        content:
          application/json:
